<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Gym - Panel de Control</title>
    <link rel="stylesheet" href="styless.css">
    <script src="in_gym.js" defer></script>
</head>
<body>
    <div class="app-container">

        <!-- BARRA LATERAL IZQUIERDA -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Atlas Gym</h2>
            </div>

            <nav class="menu">
                <button class="btn-nav" onclick="agregar_nuevos_miembros()">Agregar Miembro</button>
                <button class="btn-nav" onclick="mostrar_stock()">Tienda</button>
                <button class="btn-nav" onclick="mostrar_planes()">Planes</button>
                <button class="btn-nav" onclick="mostrar_eventos()">Eventos</button>
                <button class="btn-nav" onclick="mostrar_lista_miembros()">Lista de Miembros</button>
                <button class="btn-nav" onclick="mostrar_settings()">Ajustes</button>
            </nav>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="main">
            <div id="contenido" class="contenido">
                <h1>Atlas Gym 🏋️‍♂️</h1>
                <p>Selecciona una opción del menú</p>
            </div>
        </main>

        

    </div>
</body>
</html>
