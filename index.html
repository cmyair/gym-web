<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Atlas Gym | Iniciar sesión</title>
        <link rel="stylesheet" href="styles.css">
        <script src="login_gym.js" defer></script>
    </head>

    <body>
        <div class="container">
            <div class="login-card">
            <h1>Atlas Gym 🏋️‍♂️</h1>
            <p class="subtitle">Bienvenido al panel de administración</p>

            <form id="form-login" onsubmit="return false;">
                <div class="input-group">
                <label for="user_admin">Usuario</label>
                <input
                    type="text"
                    id="user_admin"
                    name="user_admin"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required
                >
                </div>

                <div class="input-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >
                </div>

                <div class="buttons">
                <button type="button" class="btn-primary" onclick="login()">
                    Iniciar sesión
                </button>
                <button type="button" class="btn-secondary" onclick="resetpassword()">
                    Restablecer contraseña
                </button>
                </div>
            </form>
            </div>
        </div>
    </body>
</html>
