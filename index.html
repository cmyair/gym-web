<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Atlas Gym</title>
        <link rel="stylesheet" href="styles.css">   <!-- Esta línea conecta el CSS -->
        <script src="login_gym.js" defer></script>
    </head>
    <body>
        <!-- donde se presenta los titulos de la web -->
        <div class="container">
            <div class="login-card">
                <h1>Atlas Gym 🏋️‍♂️</h1>
                <p class="subtitle">Bienvenido al Atlas Gym!</p>

                <!-- se crea una sección del inicio de sesión -->

                <section id="inicio-sesion">
                    <div class="input-group">
                        <label for="user_admin">Usuario Administrador:</label>
                        <input type="text" name="user_admin" id="user_admin" placeholder="Ingresa tu usuario">
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña">
                    </div>

                    <div class="buttons">
                        <button type="button" class="btn-primary" onclick="login()">Iniciar sesión</button>
                        <button type="button" class="btn-secondary" onclick="resetpassword()">Restablecer contraseña</button>
                    </div>
                </section>
            </div>
        </div>
    </body>
    </html>
